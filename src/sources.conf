# sync-notes configuration file
# Format:
#   [any descriptive name]
#   src          = source folder path (supports ~)
#   dst          = target path inside the notes repo
#   include_ext  = file extensions to sync, comma-separated
#   exclude_file = specific filenames to exclude from sync, comma-separated
#   exclude_dir  = subfolder names to exclude from sync, comma-separated
#   recursive    = yes / no (default yes)
#
# Comments must be on their own line; a trailing "# ..." becomes part of the value.
#
# Example:
#   [project-a]
#   src         = ~/work/project-a/docs
#   dst         = notes/project-a
#   include_ext = md
#   exclude_dir = drafts
