# www presentation-layer config file — defines which HTML pages exist under www/, and each page's source
#
# This conf is the single source of truth at page granularity.
# Unlike sources.*.conf, this one is **not per-profile**: all paths are repo-relative,
# identical on every machine — a page generated on one machine won't be generated again on another.
# Comments must be on their own line; a trailing "# ..." becomes part of the value.
#
# ── One primary file = one page ───────────────────────────────────────────
#   Whatever markdown files `main` matches, this section produces that many HTML pages, each independent.
#   The page id is <section>/<md filename>, and the output path is fixed as pages/<section>/<md filename>.html.
#
#   **The page's heading structure comes from the `main` markdown file: the Skill must not add,
#   remove, or reorder headings.**
#   NOTE on wording: a [bracketed] block in THIS file is called a "section" and is a group of
#   pages. The headings inside a markdown note are called "headings". The rule above is about
#   headings — it has nothing to do with the conf sections below.
#   This does not freeze the page. When the note itself changes, the page goes STALE:src and
#   regenerating picks up the new structure; what's ruled out is the page having a structure of
#   its own. The precise rules are in .claude/skills/notes-to-html/SKILL.md.
#   `refs` are only supporting references during translation — they never become a page on their
#   own, and can't override `main`'s structure.
#   Don't merge multiple markdown files into one page — that turns the heading structure into
#   something the LLM improvises freely, producing a different result every time it's
#   regenerated, and readers can no longer map it back to the original notes.
#
# ── Generated page (type = page, default) ─────────────────────────────────
#   title    required  Name shown in the menu. With a single primary file it's the page title;
#                       with multiple files, each page shows "title · that markdown's H1"
#   main     required  Primary file(s) to convert, repo-relative path, supports globs (* and **)
#                       Can accumulate across multiple lines with "main +=", or comma-separate on one line
#   refs     optional  Reference material, same syntax as main. Used only for cross-reference during
#                       translation, never becomes its own page
#   group    optional  Menu group name. If omitted, sits at the top level of the menu
#   order    optional  Sort order within the same group, lower numbers come first. Default 50.
#                       Pages of the same section stay adjacent
#   note     optional  Extra instructions for the notes-to-html Skill. Included in the hash —
#                       changing note marks all pages of that section as STALE:spec
#
#   Note: if `main` matches two markdown files with the same filename (in different directories),
#   their page id and output path would collide; www.py will block this and require the conf to be changed.
#
# ── External link (type = link) ────────────────────────────────────────────
#   Adds existing hand-written HTML in the repo to the menu; not generated, not hash-checked
#   title required, href required (relative to www/index.html)
#
# ── Workflow ────────────────────────────────────────────────────────────────
#   python3 src/www.py status              see which pages need attention
#   python3 src/www.py plan <page id>      get that page's main / refs, feed them to Claude
#   python3 src/www.py plan <section>      list all pages of that section at once
#   python3 src/www.py commit <page id>    generation is done, write back to the manifest
#   python3 src/www.py nav                 regenerate the menu in www/index.html
#
# For detailed design see docs/www-plan.md; for template conventions see .claude/skills/notes-to-html/SKILL.md


# ═══ Everything below is an example — replace it with your own page definitions ═════════════════
#
# Paths are repo-relative. The folder names here (notes/, research/) are just the `dst` values
# from src/sources.conf — use whatever yours are.
#
# This section produces two pages:
#   www/pages/auth-design/overview.html
#   www/pages/auth-design/token-refresh.html
#
# [auth-design]
# title    = Authentication design
# group    = Architecture
# order    = 10
# main     = notes/auth/overview.md
# main    += notes/auth/token-refresh.md
# refs     = notes/auth/*.md
# refs    += notes/storage/sessions.md
# note     = Cover the trust model before the API surface; endpoints don't need to be listed one by one
#
# Add existing hand-written HTML to the menu, without generating it:
#
# [auth-legacy]
# title = Auth notes (hand-written)
# group = Architecture
# order = 90
# type  = link
# href  = ../notes/auth/www/index.html
