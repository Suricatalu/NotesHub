# nginx site configuration for NotesHub
#
# Install:
#   sudo cp docs/nginx-noteshub.conf /etc/nginx/sites-available/noteshub
#   sudo ln -sf /etc/nginx/sites-available/noteshub /etc/nginx/sites-enabled/noteshub
#   sudo nginx -t && sudo systemctl reload nginx
#
# Opening http://localhost:8081/ automatically redirects to the menu page.
#
# root points to the **repo root** rather than www/, because the menu needs to link to
# existing HTML that stays inside the original project folders (<mirror>/*/www/index.html),
# which live outside of www/.

server {
    # Note: bound to all interfaces — any machine on the same subnet can reach the whole repo.
    # For local-only access, change to listen 127.0.0.1:8081; and remove the IPv6 line below.
    listen 8081;
    listen [::]:8081;

    server_name _;

    # ← change to the absolute path of your cloned repo
    root /path/to/NotesHub;
    index index.html;
    charset utf-8;              # prevents mojibake in Chinese filenames and content

    # Block all dotfiles and dot-directories (.git/ .claude/ .env .sync-profile etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Redirect the site root straight to the menu page. Uses = for an exact match, so
    # directory browsing under the mirror folder paths is unaffected.
    location = / {
        return 302 /www/;
    }

    # Generated HTML gets regenerated, so browsers must not use a stale cache.
    # no-cache means "always revalidate", not "never cache" — nginx still returns 304
    # when the content hasn't changed.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Every page lists its source markdown file and links back to it (Skill contract item 2).
    # .md isn't in nginx's default mime.types, so without specifying a type it would become
    # application/octet-stream, and clicking it downloads the file instead of displaying it.
    #
    # Use default_type here — do NOT change this to types { text/plain md; }.
    # `types` is a "whole replacement table", not "add one entry": writing a types block at
    # the server or location level replaces the entire mime.types table inherited from the
    # http level, so .html/.css/.js all lose their type mapping and the whole site breaks.
    # default_type only sets "the default when the type can't be looked up" — it doesn't touch that table.
    location ~* \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        autoindex on;
        autoindex_exact_size off;   # show KB/MB instead of bytes
        autoindex_localtime on;     # use local timezone instead of UTC
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/noteshub-access.log;
    error_log  /var/log/nginx/noteshub-error.log;
}
